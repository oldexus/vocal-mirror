<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Application Brand & Theme -->
    <title>VoiceMirror — Cranial Bone Conduction & Voice Confrontation Studio</title>
    <meta name="application-name" content="VoiceMirror" />
    <meta name="description" content="Acoustic Perception Calibrator & Real-Time Cranial Bone Conduction Studio. Experience bidirectional cranial bone-conduction simulation and spectral calibration in your browser." />
    <meta name="theme-color" content="#020617" />
    <meta name="color-scheme" content="dark" />

    <!-- Mobile & PWA Web App Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VoiceMirror" />

    <!-- Favicon & PWA Manifest -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VoiceMirror" />
    <meta property="og:title" content="VoiceMirror — Cranial Bone Conduction & Voice Confrontation Studio" />
    <meta property="og:description" content="Acoustic Perception Calibrator & Real-Time Cranial Bone Conduction Studio. Experience real-time cranial bone-conduction simulation and voice confrontation calibration in your browser." />
    <meta property="og:image" content="%BASE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VoiceMirror Acoustic Studio & Spectral Gap Analyzer" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ja_JP" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VoiceMirror — Cranial Bone Conduction & Voice Confrontation Studio" />
    <meta name="twitter:description" content="Acoustic Perception Calibrator & Real-Time Cranial Bone Conduction Studio. Experience real-time cranial bone-conduction simulation and voice confrontation calibration in your browser." />
    <meta name="twitter:image" content="%BASE_URL%og-image.png" />
    <meta name="twitter:image:alt" content="VoiceMirror Acoustic Studio & Spectral Gap Analyzer" />

    <!-- Production Fallback Content Security Policy for static hosting environments -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data: mediastream:; connect-src 'self' blob: data:; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />

    <!-- GitHub Pages SPA routing fallback receiver with defensive relative path validation -->
    <script>
      (function(l) {
        try {
          if (l.search && l.search[1] === '/' ) {
            var decoded = l.search.slice(1).split('&').map(function(s) { 
              return s.replace(/~and~/g, '&');
            }).join('?');
            // Ensure decoded path is strictly a relative root path and does not hijack to external/protocol-relative targets
            if (decoded.startsWith('/') && !decoded.startsWith('//') && !decoded.includes('\\')) {
              window.history.replaceState(null, null,
                  l.pathname.slice(0, -1) + decoded + l.hash
              );
            }
          }
        } catch (e) {
          // Graceful fallback on restricted browsing contexts
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
